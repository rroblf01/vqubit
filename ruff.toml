line-length = 120
target-version = "py311"
src = ["python", "tests", "examples"]
# `vcraft_build.py` and the `.pyi` stubs are generated by vcraft; they are not
# ours to lint and are regenerated on every build. Markdown is excluded so the
# documentation's example code is authored by hand.
extend-exclude = ["vcraft_build.py", "python/vqubit_native.pyi", "*.md"]

[lint]
select = [
	"E",   # pycodestyle errors
	"W",   # pycodestyle warnings
	"F",   # pyflakes
	"I",   # isort
	"UP",  # pyupgrade
	"B",   # flake8-bugbear
	"C4",  # flake8-comprehensions
	"SIM", # flake8-simplify
	"RUF", # ruff-specific
]
ignore = [
	"E501", # line length is handled by the formatter
	"W191", # the project indents with tabs, matching the V sources
]

[lint.isort]
known-first-party = ["vqubit"]

[format]
quote-style = "double"
indent-style = "tab"
docstring-code-format = true
