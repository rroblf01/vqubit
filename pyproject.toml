[build-system]
requires = []
build-backend = "vcraft_build"
backend-path = ["."]

# A project keeps its Python package under `python/` (see the generated layout),
# so a type checker or editor is told where to look: without this, `import
# <name>` is unresolved in an editor until the package is installed.
[tool.pyright]
extraPaths = ["python"]

[tool.mypy]
# A second type checker next to `ty`: mypy sees the library sources, with the
# same annotations the wheel ships. `python_version` tracks what mypy knows.
python_version = "3.14"
mypy_path = "python"
files = ["python/vqubit"]
strict = false

[tool.ty.environment]
extra-paths = ["./python"]

# The benchmark harness is not part of the package and needs Cirq installed.
[tool.ty.src]
exclude = ["benchmarks"]

# Development-only tooling. None of this ships in the vqubit wheel: the published
# package has no runtime dependencies. Install a group into the active virtualenv
# with `uv pip install --group dev` or `--group docs` (not `uv sync`, which would
# prune the editable extension that `vcraft develop` installs).
[dependency-groups]
# Pinned to the versions the project is developed and tested against, so CI and
# a local checkout resolve to the same toolchain.
dev = [
	"pytest==9.1.1",
	"coverage[toml]==7.13.4",
	"hypothesis==6.140.3",
	"towncrier==25.8.0",
	"mypy==1.19.1",
	"ruff==0.17.1",
	"ty==0.0.88",
	"build==1.6.1",
]
docs = [
	"mkdocs-material==9.7.7",
	"mkdocs-static-i18n==1.3.1",
	"mkdocstrings[python]==1.0.7",
	"mkdocstrings-python==2.0.9",
]
# Optional interoperability, tested by a dedicated CI job: with numpy installed
# the public API returns ndarray results. The published wheel never depends on it.
interop = ["numpy==2.5.4", "sympy==1.14.0"]
# The visualization helpers (`vqubit.vis`) import matplotlib lazily; never a
# runtime dependency, but installed for type checking and manual use.
vis = ["matplotlib==3.11.2"]
# Comparison harness (benchmarks/compare.py) installs Cirq to measure against it.
bench = ["cirq-core==1.7.0"]

[tool.ruff]
line-length = 120
target-version = "py311"
src = ["python", "tests", "examples"]
# `vcraft_build.py` and the `.pyi` stubs are generated by vcraft; they are not
# ours to lint and are regenerated on every build. Markdown is excluded so the
# documentation's example code is authored by hand.
extend-exclude = ["vcraft_build.py", "python/vqubit_native.pyi", "*.md"]

[tool.ruff.lint]
select = [
	"E",   # pycodestyle errors
	"W",   # pycodestyle warnings
	"F",   # pyflakes
	"I",   # isort
	"UP",  # pyupgrade
	"B",   # flake8-bugbear
	"C4",  # flake8-comprehensions
	"SIM", # flake8-simplify
	"RUF", # ruff-specific
]
ignore = [
	"E501", # line length is handled by the formatter
	"W191", # the project indents with tabs, matching the V sources
]
# The multiplication sign is used on purpose in the SWAP diagram, the way Cirq
# draws it.
allowed-confusables = ["×"]

[tool.ruff.lint.isort]
# `vqubit_native` is the project's own compiled module; its `.pyi` stub is
# generated (and git-ignored), so list it explicitly rather than relying on
# source-tree detection, which differs between a checkout and CI.
known-first-party = ["vqubit", "vqubit_native"]

[tool.ruff.format]
quote-style = "double"
indent-style = "tab"
docstring-code-format = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

# Release notes: every change lands as a fragment in `changelog.d/`, and
# `towncrier build --version X` folds them into CHANGELOG.md. The hand-written
# sections are kept: towncrier only owns the part it generates.
[tool.towncrier]
name = "vqubit"
filename = "CHANGELOG.md"
directory = "changelog.d"
title_format = "## [{version}] - {project_date}"
underlines = ["", ""]
issue_format = "https://github.com/rroblf01/vqubit/issues/{issue}"

[[tool.towncrier.type]]
directory = "added"
name = "Added"
showcontent = true

[[tool.towncrier.type]]
directory = "changed"
name = "Changed"
showcontent = true

[[tool.towncrier.type]]
directory = "deprecated"
name = "Deprecated"
showcontent = true

[[tool.towncrier.type]]
directory = "removed"
name = "Removed"
showcontent = true

[[tool.towncrier.type]]
directory = "fixed"
name = "Fixed"
showcontent = true

[[tool.towncrier.type]]
directory = "security"
name = "Security"
showcontent = true

[[tool.towncrier.type]]
directory = "docs"
name = "Documentation"
showcontent = true

[[tool.towncrier.type]]
directory = "tests"
name = "Tests"
showcontent = true
