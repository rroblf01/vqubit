line-length = 120
target-version = "py311"
src = ["python", "tests", "examples"]

[lint]
select = [
	"E",   # pycodestyle errors
	"W",   # pycodestyle warnings
	"F",   # pyflakes
	"I",   # isort
	"UP",  # pyupgrade
	"B",   # flake8-bugbear
	"C4",  # flake8-comprehensions
	"SIM", # flake8-simplify
	"RUF", # ruff-specific
]
ignore = [
	"E501", # line length is handled by the formatter
]

[lint.isort]
known-first-party = ["vqubit"]

[format]
quote-style = "double"
indent-style = "space"
docstring-code-format = true
