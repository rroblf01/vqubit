name: release

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: "cp311-abi3-manylinux-x86_64"
            os: "ubuntu-latest"
            container: "ghcr.io/rroblf01/vcraft-manylinux:1.4.5"
            args: "build --release --abi3 3.11 --target linux-x86_64-gnu --manylinux 2_28 --interpreter /opt/python/cp311-cp311/bin/python"
          - target: "cp311-abi3-manylinux-aarch64"
            os: "ubuntu-24.04-arm"
            container: "ghcr.io/rroblf01/vcraft-manylinux:1.4.5"
            args: "build --release --abi3 3.11 --target linux-aarch64-gnu --manylinux 2_28 --interpreter /opt/python/cp311-cp311/bin/python"
          - target: "cp311-abi3-musllinux-x86_64"
            os: "ubuntu-latest"
            container: "ghcr.io/rroblf01/vcraft-musllinux:1.4.5"
            args: "build --release --abi3 3.11 --target linux-x86_64-musl --musllinux 1_2 --interpreter /usr/bin/python3"
          - target: "cp311-abi3-musllinux-aarch64"
            os: "ubuntu-24.04-arm"
            container: "ghcr.io/rroblf01/vcraft-musllinux:1.4.5"
            args: "build --release --abi3 3.11 --target linux-aarch64-musl --musllinux 1_2 --interpreter /usr/bin/python3"
          - target: "cp311-abi3-macosx-arm64"
            os: "macos-26"
            args: "build --release --abi3 3.11"
          - target: "cp311-abi3-win_amd64"
            os: "windows-latest"
            args: "build --release --abi3 3.11"
    steps:
      - uses: actions/checkout@v5

      - name: set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: build the wheel
        uses: rroblf01/vcraft/actions/vcraft-action@v1
        with:
          container: ${{ matrix.container }}
          args: ${{ matrix.args }}

      - name: verify the RECORD
        shell: bash
        run: python tools/check_wheel.py dist/*.whl

      # GitHub's build provenance: `gh attestation verify <wheel> -R ...` proves
      # the file was built by this workflow from this commit.
      - name: attest the build provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: dist/*.whl

      - name: upload the wheel
        uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.target }}
          path: dist/*.whl

  sdist:
    name: source distribution
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v5

      - name: set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: install vcraft
        run: python -m pip install "vcraft==1.4.5"

      - name: build the sdist
        run: vcraft sdist

      - name: check the sdist
        run: python tools/check_wheel.py dist/*.tar.gz

      - name: attest the build provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: dist/*.tar.gz

      - name: upload the sdist
        uses: actions/upload-artifact@v6
        with:
          name: sdist
          path: dist/*.tar.gz

  publish:
    name: publish to PyPI
    needs: [build, sdist]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/vqubit
    permissions:
      id-token: write
    steps:
      - name: collect the distributions
        uses: actions/download-artifact@v6
        with:
          path: dist
          merge-multiple: true

      - name: publish
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist
