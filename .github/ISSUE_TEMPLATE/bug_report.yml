name: Bug report
description: Something behaves differently from what the documentation (or Cirq) says.
title: "bug: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. Before filing, please check
        [the differences from Cirq](https://rroblf01.github.io/vqubit/guide/cirq-differences/)
        — some divergences are deliberate and listed there.

        If this is a security problem, do **not** file it here: see
        [SECURITY.md](https://github.com/rroblf01/vqubit/blob/main/SECURITY.md).

  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Include the smallest script that shows the problem and the output you got.
      placeholder: |
        ```python
        import vqubit as vq
        ...
        ```
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
      description: If Cirq does something different, say what it does (and the Cirq version).
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: vqubit version
      description: The output of `python -c "import vqubit; print(vqubit.__version__)"`.
      placeholder: 1.0.0
    validations:
      required: true

  - type: dropdown
    id: install
    attributes:
      label: How is vqubit installed?
      options:
        - Published wheel from PyPI
        - Wheel built from the repository
        - Local build (`vcraft develop`)
    validations:
      required: true

  - type: input
    id: environment
    attributes:
      label: Python version and operating system
      placeholder: Python 3.13, macOS 15 (arm64)
    validations:
      required: true

  - type: checkboxes
    id: extras
    attributes:
      label: Which optional packages are installed?
      options:
        - label: numpy
        - label: sympy
        - label: matplotlib
        - label: cirq-core
