name: test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: build abi3 wheel (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7

      - name: set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: build the wheel
        uses: rroblf01/vcraft/actions/vcraft-action@v1
        with:
          args: build --release --abi3 3.11

      # pip does not check RECORD, so nothing else proves that the archive
      # contains exactly the files it lists.
      - name: verify the RECORD
        shell: bash
        run: python tools/check_wheel.py dist/*.whl

      - name: upload the wheel
        uses: actions/upload-artifact@v6
        with:
          name: wheel-${{ matrix.os }}
          path: dist/*.whl

  test:
    name: python ${{ matrix.python }} (${{ matrix.os }})
    needs: build
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.11", "3.12", "3.13", "3.14", "3.15"]
    steps:
      - uses: actions/checkout@v7

      - name: set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}

      - name: fetch the wheel
        uses: actions/download-artifact@v6
        with:
          name: wheel-${{ matrix.os }}
          path: dist

      - name: install the wheel and pytest
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install dist/*.whl
          python -m pip install pytest

      - name: run the test suite
        run: pytest

  interop:
    name: numpy interop
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.15"

      - name: fetch the wheel
        uses: actions/download-artifact@v6
        with:
          name: wheel-ubuntu-latest
          path: dist

      - name: install the wheel, numpy, sympy and pytest
        run: |
          python -m pip install --upgrade pip
          python -m pip install dist/*.whl numpy sympy
          python -m pip install pytest

      - name: run the test suite with numpy installed
        run: pytest

  # The numerical and contract harnesses run on every platform: the kernels are
  # native, so a rounding or endianness difference would only show up here.
  cirq-parity:
    name: numerics and parity (${{ matrix.os }})
    needs: build
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - name: set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.15"

      - name: fetch the wheel
        uses: actions/download-artifact@v6
        with:
          name: wheel-${{ matrix.os }}
          path: dist

      # bash is available on all three runners, so the glob works everywhere.
      - name: install the wheel, cirq-core and pytest
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install dist/*.whl cirq-core pytest

      - name: cross-validate the results against Cirq
        run: python benchmarks/verify.py

      - name: check the API contract against Cirq
        run: python benchmarks/parity.py

      - name: run the parity harness self-tests
        run: pytest tests/test_parity_harness.py tests/test_differential_cirq.py

  # The sdist is published next to the wheels, so prove that it really builds:
  # unpack it, build a wheel from it and install that.
  sdist:
    name: build from the sdist
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: install vcraft
        run: python -m pip install "vcraft==1.4.5"

      # The build needs the V compiler vcraft is pinned to; the build matrix
      # gets it from the action, so this job installs it by hand.
      - name: install the pinned V toolchain
        run: vcraft toolchain install

      - name: write the sdist
        run: vcraft sdist

      - name: check the sdist
        run: python tools/check_wheel.py dist/*.tar.gz

      - name: build a wheel from the unpacked sdist
        shell: bash
        run: |
          mkdir -p /tmp/sdist
          tar -xzf dist/*.tar.gz -C /tmp/sdist
          cd /tmp/sdist/vqubit-*
          if ! vcraft build --release --abi3 3.11 2>&1 | tee /tmp/vcraft.log; then
            # The job log is not always at hand; surface the tail as annotations.
            tail -n 40 /tmp/vcraft.log | while IFS= read -r line; do
              echo "::error title=vcraft build::$line"
            done
            exit 1
          fi
          python "$GITHUB_WORKSPACE/tools/check_wheel.py" dist/*.whl

      - name: install it in a clean environment and use it
        shell: bash
        run: |
          python -m venv /tmp/sdist-venv
          /tmp/sdist-venv/bin/python -m pip install --upgrade pip
          /tmp/sdist-venv/bin/python -m pip install /tmp/sdist/vqubit-*/dist/*.whl
          /tmp/sdist-venv/bin/python - <<'PYTHON'
          import vqubit as vq

          q0, q1 = vq.LineQubit.range(2)
          result = vq.Simulator().simulate(vq.Circuit(vq.H(q0), vq.CNOT(q0, q1)))
          probabilities = [abs(amplitude) ** 2 for amplitude in result.state_vector()]
          assert [round(value, 6) for value in probabilities] == [0.5, 0.0, 0.0, 0.5], probabilities
          print("sdist build works:", vq.__version__)
          PYTHON

  # `mypy.stubtest` compares the stub shipped in the wheel with the extension
  # itself. The six entries in tools/stubtest_allowlist.txt are vcraft gaps
  # (UPSTREAM.md 1 and 2) and the list is pinned, so anything new fails here.
  stubtest:
    name: stubtest (vqubit_native)
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: fetch the wheel
        uses: actions/download-artifact@v6
        with:
          name: wheel-ubuntu-latest
          path: dist

      - name: install the wheel and mypy
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install dist/*.whl "mypy==1.19.1"

      # `pyproject.toml` points mypy at `python/`, which is where the generated
      # stub normally lives; a checkout does not carry it, so take the one the
      # wheel ships (the same file a user gets).
      - name: compare the shipped stub with the extension
        shell: bash
        run: |
          stub=$(python -c "import pathlib, vqubit_native; print(pathlib.Path(vqubit_native.__file__).parent / 'vqubit_native.pyi')")
          cp "$stub" python/vqubit_native.pyi
          python -m mypy.stubtest vqubit_native --mypy-config-file pyproject.toml --allowlist tools/stubtest_allowlist.txt

  # The same commit has to produce the same bytes, or the hashes on PyPI cannot
  # be checked by anyone who rebuilds from the tag.
  reproducible:
    name: reproducible builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: install vcraft
        run: python -m pip install "vcraft==1.4.5"

      - name: install the pinned V toolchain
        run: vcraft toolchain install

      - name: build twice and compare
        run: python tools/check_reproducible.py

  # A coarse regression gate for the native kernels: the ceilings in
  # benchmarks/perf_budget.json are about five times the time measured on a
  # development machine, so a shared runner cannot fail it, but a kernel that
  # became an order of magnitude slower can.
  performance:
    name: performance gate
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.15"

      - name: fetch the wheel
        uses: actions/download-artifact@v6
        with:
          name: wheel-ubuntu-latest
          path: dist

      # numpy is not a dependency, but the sampling case takes its vectorised
      # fast path, so the job must match the environment the budget was taken in.
      - name: install the wheel and numpy
        run: python -m pip install dist/*.whl numpy

      - name: run the benchmark gate
        run: python benchmarks/perf.py

  lint:
    name: lint and type check
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: set up uv and Python
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.15"

      - name: fetch the wheel
        uses: actions/download-artifact@v6
        with:
          name: wheel-ubuntu-latest
          path: dist

      - name: install the wheel and the tools
        run: |
          uv sync --no-default-groups --group dev --group interop --group vis --no-install-project
          uv pip install dist/*.whl

      - name: ruff check
        run: .venv/bin/ruff check .

      - name: ruff format --check
        run: .venv/bin/ruff format --check .

      - name: ty check
        run: .venv/bin/ty check

      # A second checker: mypy and ty have different blind spots.
      - name: mypy check
        run: .venv/bin/python -m mypy python/vqubit

      # The 0.5 gate: no module below 80 % and the total above 95 %. The
      # threshold only goes up from here.
      # A ratchet: new public API must be documented, and the baseline of
      # already-undocumented symbols only shrinks.
      - name: public API docstrings
        run: .venv/bin/python tools/check_api_docs.py

      - name: public API annotations
        run: .venv/bin/python tools/check_api_annotations.py

      # The examples in the docstrings are real code: run them.
      - name: docstring examples
        run: .venv/bin/python -m pytest -q --doctest-modules --pyargs vqubit

      # A change to the public API has to be deliberate: if this fails, update
      # the snapshot and say whether the change is major, minor or a patch.
      - name: public API surface
        run: .venv/bin/python tools/check_api_surface.py

      - name: coverage
        run: |
          .venv/bin/python -m coverage run --source=vqubit -m pytest -q
          .venv/bin/python -m coverage report --fail-under=95
