check = "isinstance"
name = "CCX<-CCXPowGate"
reason = "vq.CCX is a CCXGate, not a CCXPowGate; cirq.CCX is a CCXPowGate."
plan = "0.3"


[[tolerated]]
check = "isinstance"
name = "CCX<-CCNotPowGate"
reason = "Alias of the previous entry (CCNotPowGate is CCXPowGate)."
