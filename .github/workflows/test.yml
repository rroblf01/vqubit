name: test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: build abi3 wheel (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v5

      - name: set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: build the wheel
        uses: rroblf01/vcraft/actions/vcraft-action@v1
        with:
          args: build --release --abi3 3.11

      - name: upload the wheel
        uses: actions/upload-artifact@v6
        with:
          name: wheel-${{ matrix.os }}
          path: dist/*.whl

  test:
    name: python ${{ matrix.python }} (${{ matrix.os }})
    needs: build
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.11", "3.12", "3.13", "3.14", "3.15"]
    steps:
      - uses: actions/checkout@v5

      - name: set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}

      - name: fetch the wheel
        uses: actions/download-artifact@v6
        with:
          name: wheel-${{ matrix.os }}
          path: dist

      - name: install the wheel and pytest
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install dist/*.whl
          python -m pip install pytest

      - name: run the test suite
        run: pytest

  interop:
    name: numpy interop
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.15"

      - name: fetch the wheel
        uses: actions/download-artifact@v6
        with:
          name: wheel-ubuntu-latest
          path: dist

      - name: install the wheel, numpy, sympy and pytest
        run: |
          python -m pip install --upgrade pip
          python -m pip install dist/*.whl numpy sympy
          python -m pip install pytest

      - name: run the test suite with numpy installed
        run: pytest

  cirq-parity:
    name: cirq parity
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.15"

      - name: fetch the wheel
        uses: actions/download-artifact@v6
        with:
          name: wheel-ubuntu-latest
          path: dist

      - name: install the wheel, cirq-core, numpy and pytest
        run: |
          python -m pip install --upgrade pip
          python -m pip install dist/*.whl cirq-core numpy pytest

      - name: cross-validate the results against Cirq
        run: python benchmarks/verify.py

      - name: check the API contract against Cirq
        run: python benchmarks/parity.py

      - name: run the parity harness self-tests
        run: pytest tests/test_parity_harness.py

  lint:
    name: lint and type check
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: set up uv and Python
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.15"

      - name: fetch the wheel
        uses: actions/download-artifact@v6
        with:
          name: wheel-ubuntu-latest
          path: dist

      - name: install the wheel and the tools
        run: |
          uv sync --no-default-groups --group dev --group interop --group vis --no-install-project
          uv pip install dist/*.whl

      - name: ruff check
        run: .venv/bin/ruff check .

      - name: ruff format --check
        run: .venv/bin/ruff format --check .

      - name: ty check
        run: .venv/bin/ty check
