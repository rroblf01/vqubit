[package]
name = "vqubit"
version = "0.3.0"
module = "vqubit_native"
description = "A dependency-free quantum computing framework for Python, written in V."
license = "MIT"
requires-python = ">=3.11"
readme = "README.md"
keywords = ["quantum", "quantum-computing", "qubit", "circuit", "simulator", "cirq", "vlang"]
authors = ["Ricardo Robles Fernández <ricardo.r.f@hotmail.com>"]
maintainers = ["Ricardo Robles Fernández <ricardo.r.f@hotmail.com>"]
classifiers = [
	"Development Status :: 3 - Alpha",
	"Intended Audience :: Developers",
	"Intended Audience :: Science/Research",
	"License :: OSI Approved :: MIT License",
	"Operating System :: MacOS",
	"Operating System :: Microsoft :: Windows",
	"Operating System :: POSIX :: Linux",
	"Programming Language :: Other",
	"Programming Language :: Python :: 3",
	"Programming Language :: Python :: 3 :: Only",
	"Programming Language :: Python :: 3.11",
	"Programming Language :: Python :: 3.12",
	"Programming Language :: Python :: 3.13",
	"Programming Language :: Python :: 3.14",
	"Programming Language :: Python :: 3.15",
	"Programming Language :: Python :: Implementation :: CPython",
	"Topic :: Scientific/Engineering :: Physics",
	"Typing :: Typed",
]
dependencies = []

[urls]
Homepage = "https://github.com/rroblf01/vqubit"
Repository = "https://github.com/rroblf01/vqubit"
Documentation = "https://rroblf01.github.io/vqubit/"
Issues = "https://github.com/rroblf01/vqubit/issues"
Changelog = "https://github.com/rroblf01/vqubit/blob/main/CHANGELOG.md"

[build]
minimum-version = "3.11"
abi3 = "3.11"
strip = true
