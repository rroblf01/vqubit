name: docs

# Documentation is deployed on every push to main. A `release: published`
# trigger used to be here too, but a release event runs with the tag as its ref
# (e.g. refs/tags/v0.2.0), and the github-pages environment only allows
# deployments from main, so the deploy was rejected -- while its `pages`
# concurrency group could also cancel the good main deployment. Since a release
# tag points at a commit already deployed from main, the trigger is redundant.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: build the documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: set up uv and Python
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.15"

      - name: install the documentation toolchain
        run: uv sync --no-default-groups --group docs --no-install-project

      - name: build
        run: .venv/bin/mkdocs build --strict

      - name: upload the site
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    name: deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: deploy
        id: deployment
        uses: actions/deploy-pages@v4
