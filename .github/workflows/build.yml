# Generated by vcraft 1.3.0 for vqubit.
# Regenerate with `vcraft generate-ci`. Do not edit by hand: the matrix is
# derived from what this version of vcraft supports, and a hand-edited matrix
# stops matching the tag logic in the binary.

name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: ${{ matrix.target }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: "cp311-abi3-manylinux-x86_64"
            os: "ubuntu-latest"
            container: "ghcr.io/rroblf01/vcraft-manylinux:1.3.0"
            abi3: "3.11"
            args: "build --release --abi3 3.11 --target linux-x86_64-gnu --manylinux 2_28 --interpreter /opt/python/cp311-cp311/bin/python"
            check: "/opt/python/cp311-cp311/bin/python"
          - target: "cp311-abi3-manylinux-aarch64"
            os: "ubuntu-24.04-arm"
            container: "ghcr.io/rroblf01/vcraft-manylinux:1.3.0"
            abi3: "3.11"
            args: "build --release --abi3 3.11 --target linux-aarch64-gnu --manylinux 2_28 --interpreter /opt/python/cp311-cp311/bin/python"
            check: "/opt/python/cp311-cp311/bin/python"
          - target: "cp311-abi3-musllinux-x86_64"
            os: "ubuntu-latest"
            container: "ghcr.io/rroblf01/vcraft-musllinux:1.3.0"
            abi3: "3.11"
            args: "build --release --abi3 3.11 --target linux-x86_64-musl --musllinux 1_2 --interpreter /usr/bin/python3"
            check: "/usr/bin/python3"
          - target: "cp311-abi3-musllinux-aarch64"
            os: "ubuntu-24.04-arm"
            container: "ghcr.io/rroblf01/vcraft-musllinux:1.3.0"
            abi3: "3.11"
            args: "build --release --abi3 3.11 --target linux-aarch64-musl --musllinux 1_2 --interpreter /usr/bin/python3"
            check: "/usr/bin/python3"
          - target: "cp311-abi3-macosx-arm64"
            os: "macos-26"
            python: "3.11"
            abi3: "3.11"
            args: "build --release --abi3 3.11"

    steps:
      - uses: actions/checkout@v5

      - name: set up Python
        id: python
        if: ${{ matrix.container == '' }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}

      - name: build
        uses: rroblf01/vcraft/actions/vcraft-action@v1
        with:
          container: ${{ matrix.container }}
          args: ${{ matrix.args }}${{ matrix.free-threading && matrix.container == '' && format(' --interpreter {0}', steps.python.outputs.python-path) || '' }}

      - name: upload
        uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.target }}
          path: dist/*.whl

      - name: test
        env:
          CONTAINER: ${{ matrix.container }}
          CHECK: ${{ matrix.check || steps.python.outputs.python-path }}
        run: |
          script="$CHECK -m venv /tmp/check && /tmp/check/bin/python -m pip install dist/*.whl && /tmp/check/bin/python -c 'import vqubit_native; print(vqubit_native.__name__)'"
          if [ -n "$CONTAINER" ]; then
            docker run --rm -e CHECK -v "$PWD:/work" -w /work "$CONTAINER" sh -c "$script"
          else
            sh -c "$script"
          fi
