# Divergences from Cirq that vqubit accepts on purpose.
#
# Every entry silences one failed check from ``benchmarks/parity.py`` and must
# say *why* (``reason``, non-empty) and *whether it is forever* (``plan``:
# ``permanent``, or the milestone where it is expected to be fixed, e.g.
# ``0.3``). ``name`` is the check name printed by the harness and may be a glob.
#
# The list cannot rot: an entry that no longer silences a real divergence makes
# the harness fail, which is how the ``0.3`` entries below turn into a to-do
# list that empties itself as the work lands.

# --- cirq.contrib ------------------------------------------------------------


[[tolerated]]
check = "namespace"
name = "contrib"
reason = """
cirq-core re-exports cirq.contrib, whose QASM importer needs the third-party
`ply`, which the zero-dependency rule forbids. vqubit ships its own parser under
vqubit.qasm instead (roadmap 0.4), so a `contrib` module will never exist.
"""
plan = "permanent"

# --- class hierarchy ---------------------------------------------------------


[[tolerated]]
check = "isinstance"
name = "*-EigenGate"
reason = """
In Cirq every power gate is an EigenGate. In vqubit EigenGate is the *single
qubit* gate (its _unitary_ is 2x2 by construction) and the multi-qubit power
gates (CZPowGate, SwapPowGate, XXPowGate, ...) derive from an internal _PowGate.
Unitaries, `**`, diagrams and parameter resolution agree; only the class used
for introspection differs. Documented in guide/cirq-differences.
"""
plan = "permanent"

# --- text diagrams -----------------------------------------------------------


[[tolerated]]
check = "diagram"
name = "C?SWAP"
reason = """
vqubit draws ``CXSWAP`` and ``CZSWAP`` as the one-line symbol
``CliffordGate(2q)``, where Cirq prints a multi-line "Clifford Gate with
Tableau" block. The renderer here is deliberately one line per qubit (see
``python/vqubit/_diagram.py``); the tableau block belongs to Cirq's much larger
drawer, not to the gate, whose tableau, unitaries and `**` all agree. Documented
in guide/cirq-differences.
"""
plan = "permanent"


[[tolerated]]
check = "diagram"
name = "T**0.5"
reason = """
Reading the same exponent differently: vqubit writes every exponent as a
decimal (``Z^0.125``) where Cirq writes the fractions it recognizes as such
(``Z^(1/8)``). Same gate, same number, different notation.
"""
plan = "permanent"
