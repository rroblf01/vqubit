# Temporary diagnostic: run the vcraft action, then re-run the build capturing
# its output. Delete once the CI is green.
name: win-debug

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/win-debug.yml"

jobs:
  debug:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: action (the failing step)
        id: act
        continue-on-error: true
        uses: rroblf01/vcraft/actions/vcraft-action@v1
        with:
          args: build --release --abi3 3.11

      - name: capture the real error
        if: always()
        shell: bash
        run: |
          echo "action outcome: ${{ steps.act.outcome }}"
          echo "=== vcraft --version ==="
          vcraft --version 2>&1 || true
          echo "=== vcraft info ==="
          vcraft info 2>&1 || true
          echo "=== build (captured) ==="
          vcraft build --release --abi3 3.11 > out.txt 2>&1
          rc=$?
          echo "exit=$rc"
          cat out.txt
          head -c 600 out.txt | tr '\n' ' ' | { read -r line; echo "::error::DIAG[${{ matrix.os }}] exit=$rc out=[$line]"; }
